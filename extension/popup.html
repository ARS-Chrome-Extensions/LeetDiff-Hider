<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LeetDiff Hider</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <div class="logo"><img src="icons/logo.svg" alt="LeetDiff Hider Logo"></div>

        <h1>LeetDiff Hider</h1>

        <p class="subtitle">
            Hide difficulty labels while solving problems.
        </p>

        <label class="toggle">

            <span>Hide Difficulty</span>

            <input type="checkbox" id="difficulty">

            <span class="slider"></span>

        </label>

        <p class="footer">
            Stay focused. Solve without bias.
        </p>

        <div class="creator">
            <span>Created by</span>

            <a href="https://github.com/atharvarajsinha" target="_blank">
                <img src="icons/github.svg" alt="GitHub">
            </a>
        </div>

    </div>

    <script src="popup.js"></script>

</body>

</html>
